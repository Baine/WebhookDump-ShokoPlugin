name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the plugin manifest (for example v2.0.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach the release archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve the release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT_NAME" in
            release) TAG="$RELEASE_TAG"; RELEASED_AT="$RELEASE_PUBLISHED_AT" ;;
            push)    TAG="$REF_NAME";    RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" ;;
            *)       TAG="$INPUT_TAG";   RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" ;;
          esac
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::Tag '${TAG}' is not a valid plugin version (expected vX.Y.Z)."
            exit 1
          fi
          {
            echo "TAG=${TAG}"
            echo "VERSION=${VERSION}"
            echo "RELEASED_AT=${RELEASED_AT}"
          } >> "$GITHUB_ENV"

      - name: Build plugin
        run: dotnet build WebhookDump/WebhookDump.csproj --configuration Release

      - name: Package plugin
        run: |
          ZIP_NAME="WebhookDump-${TAG}-any.zip"
          cd WebhookDump/bin/Release/net10.0
          zip "../../../../${ZIP_NAME}" WebhookDump.dll
          cd ../../../..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create "${TAG}" --repo "${{ github.repository }}" \
                 --title "WebhookDump ${TAG}" --generate-notes
          gh release upload "${TAG}" \
            "${ZIP_NAME}" \
            "WebhookDump/bin/Release/net10.0/WebhookDump.dll" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Update the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SOURCE_REVISION="${{ github.sha }}"
          CHECKSUM=$(sha256sum "${ZIP_NAME}" | awk '{ print $1 }')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"

          RELEASE_ENTRY=$(jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg released_at "$RELEASED_AT" \
            --arg url "$URL" \
            --arg checksum "$CHECKSUM" \
            '{
              version: $version,
              tag: $tag,
              source_revision: $source_revision,
              released_at: $released_at,
              channel: "Stable",
              archives: [
                {
                  runtime: "any",
                  abstraction: "6.0.0",
                  url: $url,
                  checksum: $checksum
                }
              ]
            }')

          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

          jq --argjson release "$RELEASE_ENTRY" '
            .releases |= [ $release ] + (. | map(select(.version != $release.version)))
          ' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date for ${TAG}."
          else
            git commit -m "ci: update manifest for ${TAG}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
