name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the plugin manifest (for example v2.0.3)"
        required: true
        type: string

jobs:
  release:
    name: Build and attach the release archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve the release tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            RELEASED_AT="${{ github.event.release.published_at }}"
          else
            TAG="${{ inputs.tag }}"
            RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          {
            echo "TAG=${TAG}"
            echo "VERSION=${TAG#v}"
            echo "RELEASED_AT=${RELEASED_AT}"
          } >> "$GITHUB_ENV"

      - name: Build plugin
        run: dotnet build WebhookDump/WebhookDump.csproj --configuration Release

      - name: Package plugin
        run: |
          ZIP_NAME="WebhookDump-${TAG}-any.zip"
          cd WebhookDump/bin/Release/net10.0
          zip "../../../../${ZIP_NAME}" WebhookDump.dll
          cd ../../../..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" \
            "${ZIP_NAME}" \
            "WebhookDump/bin/Release/net10.0/WebhookDump.dll" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Update the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_REVISION=$(git rev-parse HEAD)
          CHECKSUM=$(sha256sum "${ZIP_NAME}" | awk '{ print $1 }')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"

          RELEASE_ENTRY=$(jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg released_at "$RELEASED_AT" \
            --arg url "$URL" \
            --arg checksum "$CHECKSUM" \
            '{
              version: $version,
              tag: $tag,
              source_revision: $source_revision,
              released_at: $released_at,
              channel: "Stable",
              archives: [
                {
                  runtime: "any",
                  abstraction: "6.0.0",
                  url: $url,
                  checksum: $checksum
                }
              ]
            }')

          jq --argjson release "$RELEASE_ENTRY" '
            .releases |= [ $release ] + (. | map(select(.version != $release.version)))
          ' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "ci: update manifest for ${TAG}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
